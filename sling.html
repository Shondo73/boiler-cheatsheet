<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Требования охраны труда</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      line-height: 1.5;
      color: #333;
      background: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1, h2, h3 {
      color: #2c3e50;
    }
    p, li {
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #eef2f5;
    }
    /* Адаптив для таблиц: горизонтальная прокрутка на узких экранах */
    .table-wrapper {
      overflow-x: auto;
    }
    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Требования охраны труда во время работы</h1>
    <p>Здесь размещай основной текст. Он будет читаться на телефоне без зума.</p>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Требование</th>
            <th>Основание</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Использовать СИЗ</td>
            <td>Приказ Минтруда №…</td>
          </tr>
          <tr>
            <td>Проверять исправность инструмента</td>
            <td>Инструкция по ОТ</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
