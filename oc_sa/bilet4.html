<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Билет: 6 вопросов → 6 ответов</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; line-height: 1.5; }
  .qwrap { position: relative; margin-bottom: 8px; }
  input.q { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
  #base { width: 100%; padding: 6px; box-sizing: border-box; }
  .sug { position: absolute; left: 0; right: 0; top: 100%; background: #fff; border: 1px solid #ccc;
         border-radius: 4px; max-height: 200px; overflow-y: auto; z-index: 10;
         box-shadow: 0 2px 6px rgba(0,0,0,.15); display: none; }
  .sug div { padding: 6px 10px; cursor: pointer; }
  .sug div:hover { background: #eef; }
  pre { font-family: inherit; white-space: pre-wrap; background: #f6f6f6; padding: 10px; border-radius: 6px; }
  .missing { color: #c0392b; }
  button { padding: 10px 20px; font-size: 16px; }
  #result h2 { border-bottom: 2px solid #3a7; padding-bottom: 4px; }
  #result a { color: #1a5dab; }
</style>
</head>
<body>
<h1>Сборка билета</h1>

<p><label>HTML-файлы с ответами: <input type="file" id="files" multiple accept=".html,.htm"></label></p>

<p><input id="base" placeholder="Папка со страницами, напр.: file:///C:/bilet/ (чтобы работали ссылки «подробнее»)"></p>

<p>Введите 6 вопросов билета:</p>
<div id="fields"></div>

<p><button id="go">Собрать ответы</button></p>
<p id="log"></p>
<div id="result"></div>
<a id="save" style="display:none" download="bilet.html">💾 Скачать страницу с ответами</a>

<script>
let bank = [];

// экранирование текста, чтобы разметка страниц не ломала вывод
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// подстановка пути к папке для относительных ссылок
function resolveHref(href) {
  if (!href) return null;
  if (/^(https?:|file:|#|mailto:)/.test(href)) return href;
  const base = document.getElementById('base').value.trim();
  if (!base) return null; // относительную ссылку без базы не восстановить
  return base.replace(/\/?$/, '/') + href.replace(/^\.\//, '');
}

function cleanHTML(html) {
  const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  doc.querySelectorAll('li:empty, p:empty').forEach(e => e.remove());

  const out = [];
  doc.querySelectorAll('p, li').forEach(e => {
    const parts = [];
    e.childNodes.forEach(n => {
      if (n.tagName === 'A') {
        const href = resolveHref(n.getAttribute('href'));
        const text = n.textContent.trim();
        if (href) parts.push('<a href="' + esc(href) + '" target="_blank">' + esc(text) + '</a>');
        else parts.push(esc(text) + (text ? ' [ссылка: ' + n.getAttribute('href') + ']' : ''));
      } else {
        parts.push(esc(n.textContent));
      }
    });
    const t = parts.join('').replace(/\s+/g, ' ').trim();
    if (t) out.push((e.tagName === 'LI' ? '• ' : '') + t);
  });

  if (!out.length) {
    const t = doc.body.textContent.replace(/\s+/g, ' ').trim();
    if (t) out.push(esc(t));
  }
  return out.join('\n');
}

function norm(s) {
  return s.toLowerCase()
    .replace(/^\d+[\.\)]\s*/, '')
    .replace(/[^\wа-яё ]+/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function extractPairs(content) {
  const doc = new DOMParser().parseFromString(content, 'text/html');
  const pairs = [];
  doc.querySelectorAll('li').forEach(li => {
    const a = li.querySelector('a'), d = li.querySelector('.detail');
    if (a && d) {
      const ans = cleanHTML(d.innerHTML);
      if (ans) pairs.push([norm(a.textContent), a.textContent.trim(), ans]);
    }
  });
  doc.querySelectorAll('h2 > a').forEach(a => {
    let node = a.closest('h2').nextElementSibling, buf = '';
    while (node && node.tagName !== 'H2') { buf += node.outerHTML + '\n'; node = node.nextElementSibling; }
    const ans = cleanHTML(buf);
    if (ans) pairs.push([norm(a.textContent), a.textContent.trim(), ans]);
  });
  return pairs;
}

// ---- 6 полей с автоподсказками ----
const fieldsDiv = document.getElementById('fields');
for (let i = 1; i <= 6; i++) {
  const wrap = document.createElement('div');
  wrap.className = 'qwrap';
  const inp = document.createElement('input');
  inp.className = 'q';
  inp.placeholder = 'Вопрос ' + i;
  const sug = document.createElement('div');
  sug.className = 'sug';
  inp.addEventListener('input', () => showSug(inp, sug));
  inp.addEventListener('blur', () => setTimeout(() => sug.style.display = 'none', 150));
  wrap.appendChild(inp); wrap.appendChild(sug);
  fieldsDiv.appendChild(wrap);
}

function showSug(inp, sug) {
  const nq = norm(inp.value);
  if (!nq || !bank.length) { sug.style.display = 'none'; return; }
  const hits = bank.filter(([nt]) => nt.includes(nq) || nq.includes(nt)).slice(0, 8);
  if (!hits.length) { sug.style.display = 'none'; return; }
  sug.innerHTML = '';
  hits.forEach(([, title]) => {
    const item = document.createElement('div');
    item.textContent = title;
    item.addEventListener('mousedown', e => {
      e.preventDefault();
      inp.value = title;
      sug.style.display = 'none';
    });
    sug.appendChild(item);
  });
  sug.style.display = 'block';
}

document.getElementById('files').addEventListener('change', e => {
  bank = [];
  let left = e.target.files.length;
  Array.from(e.target.files).forEach(file => {
    const r = new FileReader();
    r.onload = ev => { bank.push(...extractPairs(ev.target.result)); if (--left === 0) ready(); };
    r.readAsText(file, 'utf-8');
  });
});

function ready() {
  document.getElementById('log').textContent = 'Загружено вопросов: ' + bank.length + ' — подсказки работают.';
}

document.getElementById('go').addEventListener('click', () => {
  const questions = Array.from(document.querySelectorAll('input.q')).map(i => i.value.trim()).filter(Boolean);
  if (questions.length < 6) { alert('Заполните все 6 вопросов'); return; }
  if (!bank.length) { alert('Сначала выберите HTML-файлы с ответами'); return; }

  let html = '<h1>Ответы на билет</h1>', miss = 0;
  questions.forEach(q => {
    const nq = norm(q);
    const m = bank.find(([nt]) => nt.includes(nq) || nq.includes(nt));
    if (m) html += '<h2>' + esc(q) + '</h2><pre>' + m[2] + '</pre>';
    else { html += '<h2 class="missing">✗ ' + esc(q) + '</h2><p class="missing">Ответ не найден</p>'; miss++; }
  });

  document.getElementById('result').innerHTML = html;

  const blob = new Blob(['<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"></head><body>' + html + '</body></html>'], {type: 'text/html'});
  const save = document.getElementById('save');
  save.href = URL.createObjectURL(blob);
  save.style.display = 'inline';
});
</script>
</body>
</html>
