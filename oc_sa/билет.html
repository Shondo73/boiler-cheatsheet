<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сборка билета — 7 вопросов с ответами и комментариями</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin:0; padding:16px; background:#f5f7fa; color:#2c3e50; line-height:1.55; }
  h1 { text-align:center; font-size:1.5rem; margin:8px 0 4px; }
  .sub { text-align:center; color:#7f8c8d; font-size:.95rem; margin-bottom:18px; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px; }
  button { border:0; border-radius:8px; padding:10px 16px; font-size:.95rem; cursor:pointer; background:#007bff; color:#fff; }
  button:hover { background:#0069d9; }
  .btn-warn { background:#e67e22; } .btn-warn:hover { background:#d35400; }
  .btn-ok { background:#27ae60; } .btn-ok:hover { background:#1e8449; }
  .btn-grey { background:#95a5a6; } .btn-grey:hover { background:#7f8c8d; }
  .slot { max-width:860px; margin:0 auto 14px; position:relative; }
  .slot-label { font-weight:600; margin-bottom:4px; font-size:.95rem; }
  .slot input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #ccd5dd; border-radius:8px; font-size:1rem; }
  .slot input:focus { outline:2px solid #007bff55; border-color:#007bff; }
  .ac { position:absolute; z-index:30; left:0; right:0; top:100%; margin-top:2px; background:#fff; border:1px solid #ccd5dd; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:320px; overflow:auto; display:none; }
  .ac-item { padding:9px 12px; cursor:pointer; border-bottom:1px solid #eef2f5; }
  .ac-item:last-child { border-bottom:0; }
  .ac-item:hover { background:#eef6ff; }
  .ac-item .t { display:block; font-size:.78rem; color:#007bff; margin-top:2px; }
  .ac-empty { padding:10px 12px; color:#7f8c8d; font-size:.9rem; }
  .card { max-width:860px; margin:0 auto 14px; background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.07); padding:16px 18px; }
  .chip { display:inline-block; font-size:.78rem; padding:3px 10px; border-radius:20px; color:#fff; margin-bottom:8px; }
  .card .q { font-weight:600; font-size:1.05rem; margin-bottom:8px; }
  .card .a { white-space:pre-wrap; font-size:.97rem; }
  .comment { margin-top:12px; background:#fff8e1; border-left:4px solid #f6b93b; border-radius:6px; padding:10px 12px; font-size:.92rem; }
  .comment .ch { font-weight:600; color:#b7791f; }
  .ucmt { margin-top:10px; }
  .ucmt label { font-size:.82rem; color:#7f8c8d; }
  .ucmt textarea { width:100%; box-sizing:border-box; min-height:52px; border:1px dashed #ccd5dd; border-radius:8px; padding:8px 10px; font-size:.9rem; resize:vertical; font-family:inherit; }
  .bank { max-width:860px; margin:26px auto 0; }
  .bank h2 { font-size:1.15rem; border-bottom:2px solid #007bff; padding-bottom:6px; }
  .bank input { width:100%; box-sizing:border-box; padding:9px 12px; border:1px solid #ccd5dd; border-radius:8px; margin-bottom:10px; font-size:.95rem; }
  .group-title { font-weight:600; margin:14px 0 6px; color:#34495e; }
  .qitem { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.06); padding:9px 12px; margin-bottom:6px; cursor:pointer; font-size:.95rem; }
  .qitem:hover { background:#eef6ff; }
  .qitem .t { display:block; font-size:.78rem; color:#007bff; margin-top:2px; }
  .hide { display:none; }
  @media print {
    .btns, .bank, .slot input, .ucmt, .sub, .noprint { display:none !important; }
    .card, .slot-label { box-shadow:none; border:1px solid #ddd; }
    body { background:#fff; padding:0; }
  }
</style>
</head>
<body>
<h1>Сборка билета</h1>
<p class="sub">7 вопросов → ответы и комментарии. Начните печатать — появятся подсказки из банка вопросов.</p>
<div class="btns noprint">
  <button class="btn-ok" onclick="collect()">Собрать ответы</button>
  <button class="btn-warn" onclick="randomTicket()">🎲 Случайный билет</button>
  <button class="btn-grey" onclick="clearAll()">Очистить</button>
  <button onclick="downloadStatic()">💾 Скачать страницу с ответами</button>
  <button class="btn-grey" onclick="window.print()">🖨 Печать</button>
</div>
<div id="slots"></div>
<div class="bank noprint">
  <h2>Все вопросы (106)</h2>
  <input id="bankSearch" placeholder="Поиск по всем вопросам…" oninput="renderBank()">
  <div id="bankList"></div>
</div>

<script src="fun/otvet.js" defer></script>
<script src="fun/functi.js" defer></script>
</body>
</html>
