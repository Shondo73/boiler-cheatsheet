<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборка билета — 7 вопросов</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; margin:0; background:#f2f4f8; color:#1c2330; }
  header { background:#1c2330; color:#fff; padding:18px 24px; }
  header h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; opacity:.75; font-size:13px; }
  main { max-width:960px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:12px; padding:20px; margin-bottom:18px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  h2 { font-size:17px; margin:0 0 12px; }
  .qrow { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .qnum { flex:0 0 26px; height:26px; border-radius:50%; background:#1c2330; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
  .qrow input { flex:1; padding:9px 12px; border:1px solid #cdd4e0; border-radius:8px; font-size:14px; }
  .qrow input:focus { outline:2px solid #4a7dff; border-color:transparent; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  button { border:0; border-radius:8px; padding:10px 16px; font-size:14px; cursor:pointer; font-weight:600; }
  .b-primary { background:#4a7dff; color:#fff; }
  .b-dice { background:#7c3aed; color:#fff; }
  .b-ghost { background:#e8ecf4; color:#1c2330; }
  .b-dl { background:#1e9e5a; color:#fff; }
  button:active { transform:translateY(1px); }
  #results { margin-top:6px; }
  .ans { border:1px solid #e3e7ef; border-radius:10px; padding:14px 16px; margin-bottom:10px; background:#fafbfe; }
  .ans .num { font-weight:700; }
  .ans .q { font-weight:700; margin:4px 0 8px; }
  .ans .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; color:#fff; margin-left:6px; vertical-align:middle; }
  .ans .a { font-size:14px; line-height:1.5; white-space:pre-wrap; }
  .warn { background:#fff6e5; border:1px solid #f0d9a0; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:10px; }
  .suggest { margin-top:6px; font-size:13px; }
  .suggest button { padding:4px 10px; font-size:12px; margin:2px 4px 2px 0; background:#eef1f8; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar input { flex:1; min-width:180px; padding:8px 12px; border:1px solid #cdd4e0; border-radius:8px; font-size:14px; }
  details.tgroup { margin-bottom:8px; border:1px solid #e3e7ef; border-radius:10px; overflow:hidden; }
  details.tgroup summary { padding:10px 14px; cursor:pointer; font-weight:600; font-size:14px; background:#f7f8fc; }
  details.tgroup ul { list-style:none; margin:0; padding:6px 0; max-height:260px; overflow:auto; }
  details.tgroup li { padding:7px 14px; font-size:13px; cursor:pointer; }
  details.tgroup li:hover { background:#eef1f8; }
  .count { font-weight:400; font-size:12px; opacity:.7; }
  .hint { font-size:12px; color:#5b6472; margin-top:10px; }
  @media print { .btns, .card.noprint { display:none; } }
</style>
</head>
<body>
<header>
  <h1>Сборка билета — 7 вопросов</h1>
  <p>База: эксплуатация котельной, охрана труда, первая помощь, стропальщик, пожарная безопасность (106 вопросов)</p>
</header>
<main>

<div class="card">
  <h2>Билет: введите 7 вопросов</h2>
  <div id="fields"></div>
  <div class="btns">
    <button class="b-primary" onclick="collect()">Собрать ответы</button>
    <button class="b-dice" onclick="randomTicket()">🎲 Случайный билет</button>
    <button class="b-ghost" onclick="clearAll()">Очистить</button>
  </div>
  <div class="hint">Вопросы можно вводить вручную, кликать из банка вопросов ниже или взять целиком случайный билет кнопкой 🎲.</div>
</div>

<div class="card" id="resultsCard" style="display:none">
  <h2>Ответы</h2>
  <div class="btns">
    <button class="b-dl" onclick="downloadAnswers()">💾 Скачать страницу с ответами</button>
    <button class="b-ghost" onclick="printAnswers()">Печать</button>
  </div>
  <div id="results" style="margin-top:12px"></div>
</div>

<div class="card noprint">
  <h2>Банк вопросов</h2>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Поиск по вопросам…" oninput="renderBank()">
    <span class="count" id="bankCount"></span>
  </div>
  <div id="bank"></div>
</div>

</main>

<script>
const DATA = [{"t": "Эксплуатация", "q": "Классификация горелок по способу подачи воздуха, подачи газа", "a": "По способу подачи воздуха: атмосферные — воздух поступает за счёт разрежения в топке или конвекции; инжекционные — газ засасывает воздух своей струёй; вентиляторные (дутьевые) — воздух нагнетается принудительно вентилятором. По способу подачи газа: с подачей газа под давлением; с инжекцией газа воздухом."}, {"t": "Эксплуатация", "q": "Типы газовых горелок, их устройство и работа", "a": "Атмосферные (инжекторные): газ выходит из сопла, создаёт разрежение, подсасывает воздух; газовоздушная смесь смешивается в смесителе и сгорает. Вентиляторные (дутьевые): воздух подаётся встроенным вентилятором; точная регулировка мощности, работа с закрытой камерой сгорания. Диффузионные: топливо и воздух смешиваются непосредственно в зоне горения. С полным/неполным предварительным смешением: газ смешивается с воздухом полностью или частично до выхода из горелки."}, {"t": "Эксплуатация", "q": "Устройство водотрубного водогрейного котла", "a": "Теплоноситель (вода) движется внутри труб, горячие газы омывают их снаружи. Основные элементы: топочная камера; экраны (трубы, формирующие стенки топки); коллекторы (соединяют трубы); конвективный газоход с пучком труб; водяная рубашка, арматура и приборы контроля."}, {"t": "Эксплуатация", "q": "Устройство жаротрубного водогрейного котла", "a": "Горячие дымовые газы проходят внутри труб, вода окружает их (водяная рубашка). Конструкция: два цилиндра разного диаметра (один внутри другого); топка в передней части; конвективный пучок труб в задней части; система автоматического управления."}, {"t": "Эксплуатация", "q": "Устройство секционного водогрейного котла", "a": "Состоит из отдельных чугунных или стальных секций, гидравлически соединённых между собой. Внутри может размещаться водоохлаждаемая жаровая труба для локализации зоны высоких температур и снижения термических напряжений."}, {"t": "Эксплуатация", "q": "Положительные и отрицательные свойства природного газа. Плотность, цвет, запах, токсичность", "a": "Плотность: примерно 0,7–0,8 кг/м³ (легче воздуха). Цвет: бесцветный. Запах: в чистом виде без запаха; для обнаружения утечек добавляют одорант (например, этилмеркаптан). Токсичность: сам по себе малотоксичен, но при неполном сгорании образует угарный газ (CO) — сильный токсикант. Пожаро- и взрывоопасен. Положительные свойства: высокая теплотворная способность, удобство транспортировки, относительно чистое сгорание. Отрицательные: взрывоопасность, риск отравления CO при неисправной вентиляции/оборудовании."}, {"t": "Эксплуатация", "q": "Полное и неполное сгорание газа. Причины неполного сгорания", "a": "Полное сгорание: газ сгорает полностью с образованием CO₂ и H₂O. Неполное сгорание: образуются CO, сажа, несгоревшие углеводороды. Причины неполного сгорания: недостаток кислорода; плохое смесеобразование; низкая температура в зоне горения; нестабильность факела."}, {"t": "Эксплуатация", "q": "Преимущество газообразного топлива перед другими видами", "a": "Высокий КПД; относительно низкая стоимость; меньшая зольность и шлакообразование; экологическая безопасность по сравнению с твёрдым топливом; удобство транспортировки и регулирования."}, {"t": "Эксплуатация", "q": "Назначение, устройство, принцип работы и регулирование регулятора давления газа", "a": "Назначение: поддержание постоянного давления газа перед горелкой независимо от колебаний в сети. Устройство: корпус, мембрана, пружина, запорно-регулирующий клапан. Принцип работы: при изменении давления мембрана смещается и перемещает клапан. Регулирование: настройкой пружины (задаётся требуемое давление)."}, {"t": "Эксплуатация", "q": "Арматура и гарнитура котлоагрегата. Маркировка. Требования к арматуре", "a": "Арматура: запорная (краны, задвижки); регулирующая (вентили); предохранительная (предохранительный и обратный клапаны); контрольно-измерительная (манометры, термометры). Гарнитура: устройства для обслуживания (лазы, люки, площадки, гляделки, предохранительные взрывные клапаны), элементы теплоизоляции, крепления. Требования: герметичность, прочность, соответствие параметрам котла, наличие маркировки (тип, давление, температура, производитель)."}, {"t": "Эксплуатация", "q": "Гидравлические испытания котла", "a": "Проводят для проверки прочности и плотности элементов под давлением, превышающим рабочее. Котёл заполняют водой, создают давление в 1,25 раза выше рабочего и выдерживают 5–10 минут. Отсутствие течи и недопустимых деформаций свидетельствует об исправности. По результатам составляется акт с указанием давления, времени и результатов; данные вносятся в журнал эксплуатации. При выявлении дефектов указываются рекомендации по ремонту. Испытания проводят: перед началом эксплуатации; после ремонта; каждые 8 лет."}, {"t": "Эксплуатация", "q": "Виды обслуживания газопроводов", "a": "Плановые осмотры; очистка от загрязнений; проверка герметичности; смазка запорной арматуры; замена изношенных участков; контроль состояния изоляционных покрытий."}, {"t": "Эксплуатация", "q": "Проверка на плотность внутреннего газового оборудования (газопровода)", "a": "Методы: обмыливание соединений; газоанализаторы; проверка по одоранту (запаху этилмеркаптана). При обнаружении утечек принимают меры по устранению."}, {"t": "Эксплуатация", "q": "Какие работы называются газоопасными и их перечень", "a": "Газоопасные работы — это работы, выполняемые в газоопасной среде, или в процессе их проведения возможен выход газа. Перечень: вскрытие газопроводов; ремонт арматуры; пуск газа; работы в колодцах, тоннелях; ликвидация утечек; работы в замкнутых пространствах."}, {"t": "Эксплуатация", "q": "Порядок допуска к выполнению и выполнение газоопасных работ", "a": "Оформление наряда-допуска; инструктаж; проверка средств защиты и приборов контроля; выполнение работ бригадой не менее чем из двух человек; обеспечение вентиляции, исключение источников зажигания."}, {"t": "Эксплуатация", "q": "Наряд-допуск на выполнение работ повышенной опасности", "a": "Документ, разрешающий проведение работ повышенной опасности. В нём указываются: место и время работ; характер работ; состав бригады; ответственные лица; меры безопасности."}, {"t": "Эксплуатация", "q": "Переход на байпас и обратно", "a": "Выполняется при необходимости ремонта основного регулятора или при колебаниях давления в сети: 1) открывают задвижки байпаса; 2) настраивают регулятор на байпасе; 3) закрывают основную линию и снимают её с эксплуатации; 4) при возврате — повторяют действия в обратном порядке с контролем параметров."}, {"t": "Эксплуатация", "q": "Требования, предъявляемые к помещениям газовых котельных", "a": "Достаточная вентиляция (естественная и принудительная); наличие окон для естественного освещения и аварийного сброса давления; газоплотные ограждения; освещение, пожарная безопасность; доступ для обслуживания."}, {"t": "Эксплуатация", "q": "Пуск газа ГРУ (ГРП). Порядок пуска ГРУ, ГРП", "a": "Проводится по наряду-допуску. Последовательность: 1) проверка герметичности; 2) продувка линий; 3) постепенное открытие запорной арматуры; 4) контроль давления и работы регуляторов; 5) проверка срабатывания предохранительных устройств."}, {"t": "Эксплуатация", "q": "Виды обслуживания ГРУ, ГРП", "a": "Осмотры; чистка фильтров; проверка и настройка регуляторов и предохранительных устройств; смазка запорной арматуры; замена изношенных деталей; контроль герметичности."}, {"t": "Эксплуатация", "q": "Техника безопасности при ремонте теплоизоляции, обмуровочных работах", "a": "Использование средств защиты (перчатки, спецодежда, каски); работа в проветриваемом помещении; контроль отсутствия давления и температуры в оборудовании; применение инструментов, исключающих искрообразование."}, {"t": "Эксплуатация", "q": "Виды испытаний теплосетей и сроки", "a": "Гидравлические (на прочность и плотность); тепловые (на теплопотери); испытания на коррозионную стойкость. Сроки устанавливаются нормативными документами (например, ежегодные гидравлические испытания)."}, {"t": "Эксплуатация", "q": "Устройство центробежных насосов", "a": "Состоит из корпуса; рабочего колеса с лопатками; вала, подшипников, уплотнений. При вращении колеса создаётся центробежная сила, которая перемещает жидкость."}, {"t": "Эксплуатация", "q": "Техника безопасности при ремонте центробежных насосов", "a": "Полная остановка и отключение от сети; блокировка (LOTO), чтобы исключить случайный пуск; использование СИЗ; проверка отсутствия остаточного давления и вращения; контроль температуры."}, {"t": "Эксплуатация", "q": "Подготовка котла к ремонту", "a": "1) остановка и охлаждение; 2) отключение от коммуникаций; 3) продувка и промывка; 4) установка заглушек; 5) проверка отсутствия давления и температуры; 6) оформление наряда-допуска."}, {"t": "Эксплуатация", "q": "Классификация газопроводов (по расположению, по назначению)", "a": "По расположению: наружные (уличные, межцеховые); внутренние (в помещениях). По назначению: магистральные; распределительные; вводные; внутренние; импульсные."}, {"t": "Эксплуатация", "q": "Причины утечек газа и меры безопасности при устранении", "a": "Причины: износ уплотнений; коррозия; механические повреждения; неправильная установка. Меры безопасности при обнаружении утечки: прекратить работы; проветрить помещение; не включать/выключать электрооборудование; вызвать аварийную службу."}, {"t": "Эксплуатация", "q": "Причина отрыва пламени и проскока его внутрь горелки", "a": "Отрыв пламени: резкое снижение скорости потока газовоздушной смеси; недостаток кислорода; сильное разрежение в топке. Проскок пламени внутрь горелки: слишком высокая скорость потока; неправильное соотношение газа и воздуха; засорение отверстий в горелке."}, {"t": "Эксплуатация", "q": "Устройство, работа и назначение ПСК, ПЗК, параметры настройки, места установки", "a": "ПСК (предохранительный сбросной клапан): назначение — сбрасывает избыточное давление; давление срабатывания обычно на 15% выше рабочего. ПЗК (предохранительный запорный клапан): назначение — перекрывает газ потребителю при повышении или понижении давления; давление срабатывания — верхний порог примерно +25% от рабочего, нижний зависит от горелки."}, {"t": "Охрана труда", "q": "Техника безопасности при обслуживании трубопроводов", "a": "Перед работами трубопровод отключают, устанавливают заглушки, освобождают от продукта, промывают/пропаривают/продувают инертным газом. Контролируют отсутствие опасных веществ газоанализатором. Используют СИЗ, при необходимости — переносные светильники во взрывозащищённом исполнении напряжением не выше 12 В. Работы проводят по наряду-допуску, если это газоопасные или огневые работы."}, {"t": "Охрана труда", "q": "Требования к слесарному инструменту при выполнении газоопасных работ", "a": "Инструмент должен быть из материала, исключающего искрообразование (бронза, бериллиевая бронза, омеднённый инструмент). Допускается инструмент из чёрного металла только при условии обильной смазки рабочей части. Обувь — без стальных гвоздей/подковок либо используют диэлектрические галоши. Запрещено применять электроинструмент в загазованной зоне без взрывозащиты."}, {"t": "Охрана труда", "q": "Техника безопасности при ремонте вращающихся механизмов", "a": "Механизм полностью останавливают, отключают от всех источников энергии (электричество, пар, гидравлика, сжатый воздух), применяют блокировку (LOTO), вывешивают предупреждающие плакаты. Перед началом работ проверяют отсутствие остаточного вращения, напряжения и давления. Ограждения и кожухи возвращают до пуска. Запрещено чистить, протирать или смазывать вращающиеся части на ходу."}, {"t": "Охрана труда", "q": "Техника безопасности при работе на высоте, с лесов", "a": "Леса монтируют по проекту, проверяют устойчивость и наличие ограждений. Работники используют страховочные системы (привязь, стропы, анкерные линии). Площадки ограждают, контролируют нагрузку. Перед началом проводят осмотр и допуск, фиксируют в журнале. При высоте более 1,8 м обязателен наряд-допуск. Запрещено работать при сильном ветре, гололёде, плохой видимости."}, {"t": "Охрана труда", "q": "Правила безопасности, предъявляемые к оборудованию котельных", "a": "Оборудование должно соответствовать проекту, иметь паспорта, КИП, системы защиты и блокировки. Регулярно проводят ТО, проверки герметичности, контроль параметров (давление, температура, уровень воды). На видном месте вывешивают схемы, инструкции, таблички с предельными параметрами. Не допускается эксплуатация при неисправных предохранительных клапанах, манометрах, блокировках."}, {"t": "Охрана труда", "q": "Техника безопасности при ремонте ГРП, ГРУ", "a": "Перед ремонтом отключают участок, устанавливают заглушки, продувают, контролируют загазованность. Работы проводят по наряду-допуску, с СИЗ и наблюдающим. Используют искробезопасный инструмент. Запрещено проводить огневые работы без отдельного наряда и подготовки зоны. После ремонта выполняют контрольную опрессовку."}, {"t": "Охрана труда", "q": "Техника безопасности при производстве изоляционных работ", "a": "Учитывают свойства материалов (пыльность, токсичность при нагреве). Используют СИЗ органов дыхания (респираторы FFP2/FFP3), кожи, глаз. При работе с нагретыми поверхностями — термостойкую спецодежду и перчатки. Обеспечивают вентиляцию, не допускают открытого огня. Материалы хранят в специально отведённых местах, отходы собирают в закрытые контейнеры."}, {"t": "Охрана труда", "q": "Техника безопасности при обслуживании оборудования котельных", "a": "Соблюдение инструкций, контроль параметров, блокировка источников энергии, использование СИЗ, регулярный осмотр. Не допускается вмешательство в работу защит и блокировок. Все отклонения фиксируют в оперативном журнале, о неисправностях немедленно докладывают руководителю."}, {"t": "Охрана труда", "q": "Подъём и транспортирование тяжестей (механизированная и ручная)", "a": "При ручной работе соблюдают нормы предельно допустимых нагрузок (для мужчин — не более 50 кг разово, для женщин — не более 15 кг). Используют правильную технику подъёма (с прямой спиной, за счёт ног), при необходимости — вспомогательные приспособления (рохли, тележки). При механизированной — проверяют грузоподъёмность, исправность грузозахватных приспособлений, строповку по схеме. Запрещено находиться под грузом, превышать грузоподъёмность, использовать повреждённые стропы."}, {"t": "Охрана труда", "q": "Техника безопасности при замене и смазке крана на действующем газопроводе", "a": "Участок отключают, ставят заглушки, продувают, проверяют отсутствие газа газоанализатором. Работы выполняют по наряду-допуску, искробезопасным инструментом и в СИЗ. Смазку наносят только при отсутствии давления и после проверки герметичности. После работ проводят контрольную опрессовку и проверку на утечки."}, {"t": "Охрана труда", "q": "Техника безопасности при устранении утечек газа", "a": "Сначала локализуют участок (отключение, заглушки), контролируют загазованность газоанализатором, исключают источники воспламенения. Работают в СИЗ органов дыхания (изолирующий противогаз при высокой концентрации). Работы проводят минимум двумя лицами, один из которых — наблюдающий. Запрещено использовать открытый огонь, включать/выключать электрооборудование в зоне утечки."}, {"t": "Охрана труда", "q": "Техника безопасности при сварочных работах", "a": "Оформляют наряд-допуск на огневые работы. Очищают зону от горючих материалов в радиусе не менее 5 м, защищают соседние конструкции негорючими экранами. Используют СИЗ (маска, перчатки, спецодежда), средства вентиляции. На рабочем месте должны быть огнетушители и покрывало. После окончания работ наблюдают за местом не менее 2 часов."}, {"t": "Охрана труда", "q": "Техника безопасности при обнаружении утечки газа в ГРУ (ГРП)", "a": "Немедленно прекращают работы, эвакуируют персонал, исключают источники огня, проветривают помещение, локализуют утечку, сообщают ответственному. Не включают и не выключают электрооборудование в помещении. Выставляют предупредительные знаки, не допускают посторонних. Действия выполняют строго по плану локализации и ликвидации аварий."}, {"t": "Охрана труда", "q": "Порядок расследования несчастных случаев", "a": "Оказать пострадавшему первую помощь, при необходимости вызвать скорую и доставить в медорганизацию. Принять меры, чтобы не допустить развития аварии и защитить других работников от опасности. По возможности сохранить обстановку на месте происшествия. Если это невозможно (угроза жизни, продолжение работы), зафиксировать её: сделать фото, видео, составить схемы."}, {"t": "Охрана труда", "q": "Безопасность при работе грузоподъемных механизмов", "a": "Проверяют исправность, грузоподъёмность, состояние грузозахватных приспособлений и строп (наличие бирок, отсутствие повреждений). Соблюдают схемы строповки, не превышают нагрузку, используют сигнализацию. Запрещено поднимать людей, оставлять груз на весу без надзора, работать при неисправных тормозах или ограничителях."}, {"t": "Охрана труда", "q": "Требования безопасности при производстве ремонтных работ в барабанах котлов, в газоходах, топках, при работе в камерах, колодцах", "a": "Работы проводят по наряду-допуску. Обеспечивают вентиляцию, контроль воздушной среды (газоанализ до начала и периодически). Используют СИЗ органов дыхания и страховочные системы. Для спуска/подъёма — лестницы из неискрящих материалов. Назначают наблюдающего снаружи, обеспечивают связь. Запрещено работать одному."}, {"t": "Охрана труда", "q": "Индивидуальные средства защиты, используемые в газовых котельных", "a": "Противогазы (изолирующие при высокой загазованности, фильтрующие — при допустимых концентрациях), респираторы, защитные очки, перчатки (диэлектрические, термостойкие, химстойкие), спецодежда, каски, страховочные привязи. СИЗ должны быть сертифицированы, исправны, подобраны по размеру. Перед применением работник обязан проверить целостность и срок годности."}, {"t": "Охрана труда", "q": "Требования безопасности при работе с электроинструментом", "a": "Проверяют исправность, класс защиты, состояние кабеля и вилки. Используют диэлектрические средства (коврик, перчатки), соблюдают правила подключения. Запрещено работать во влажной среде, с повреждённым кабелем, без заземления. Инструмент должен иметь маркировку и инвентарный номер, проходить периодические проверки."}, {"t": "Охрана труда", "q": "Техника безопасности при продувке и замене водоуказательных стекол", "a": "При продувке: предупредить персонал, соблюдать порядок действий, контролировать уровень в котле, действовать плавно, не использовать неисправную арматуру, следить за признаками проблем, организовать безопасный слив, проверить результат. При замене стекла: полностью отключить прибор, использовать защитные средства, установить новое стекло, после установки проверить герметичность."}, {"t": "Охрана труда", "q": "Мероприятия по безопасности при ремонте электроустановок", "a": "Полное отключение от сети, блокировка, проверка отсутствия напряжения, заземление, вывешивание плакатов, работа по наряду-допуску. Используют основные и дополнительные СИЗ (перчатки, коврик, инструмент с изолированными рукоятками). Запрещено выполнять работы без проверки отсутствия напряжения на токоведущих частях."}, {"t": "Охрана труда", "q": "Инструктажи. Виды и сроки", "a": "Вводный — при приёме на работу. Первичный — на рабочем месте до начала самостоятельной работы. Повторный — не реже 1 раза в 6 месяцев. Внеплановый — при изменении норм, после аварий, по требованию надзорных органов. Целевой — перед разовыми или опасными работами. Факт проведения фиксируют в журналах с подписями."}, {"t": "Охрана труда", "q": "Понятие охраны труда", "a": "Система сохранения жизни и здоровья работников в процессе трудовой деятельности, включающая правовые, социально-экономические, организационно-технические, санитарно-гигиенические и иные мероприятия. Цель — предотвращение травматизма, профзаболеваний, аварий, а также создание безопасных условий труда."}, {"t": "Охрана труда", "q": "Права работников на льготы и компенсации за тяжелые и вредные условия труда", "a": "В зависимости от класса условий труда работникам полагаются: доплата за вредные и (или) опасные условия труда; сокращённая продолжительность рабочего времени; ежегодный дополнительный оплачиваемый отпуск; досрочное назначение трудовой пенсии; выдача молока или других равноценных продуктов питания; обязательные предварительные и периодические медицинские осмотры за счёт работодателя. Конкретный перечень льгот устанавливается по результатам специальной оценки условий труда."}, {"t": "Охрана труда", "q": "Периодическая и внеочередная проверка знаний", "a": "Периодическая — по графику (например, ежегодно для ряда категорий). Внеочередная — при изменении норм, после аварий, по требованию надзорных органов, при переводе на другую работу. Проводят комиссией, результаты оформляют протоколом."}, {"t": "Охрана труда", "q": "Какие приспособления должны устанавливаться для удобного и безопасного обслуживания котлов, пароперегревателей и экономайзеров", "a": "Стационарные площадки и лестницы; перила и обшивка; выходы на длинных площадках; переходные мостики; лазы, лючки и смотровые окна."}, {"t": "Охрана труда", "q": "Какие вредные и опасные производственные факторы в процессе работы влияют на слесаря-ремонтника?", "a": "Повышенный уровень шума и вибрации; загазованность воздуха рабочей зоны (утечки газа, угарный газ); запылённость; недостаточная освещённость; работа на высоте; опасность поражения электрическим током; работа в замкнутых пространствах (колодцы, барабаны котлов, газоходы); острые кромки деталей и инструмента; повышенная температура поверхностей оборудования; тяжёлый физический труд и неудобная рабочая поза."}, {"t": "Охрана труда", "q": "Какую ответственность несет слесарь-ремонтник во время работы?", "a": "Соблюдает требования охраны труда и пожарной безопасности, правильно применяет СИЗ; проходит обучение и проверку знаний; немедленно извещает руководителя о ситуации, угрожающей жизни и здоровью людей, о каждом несчастном случае и об ухудшении своего здоровья; выполняет только порученную работу по наряду-допуску на опасные работы; не допускает посторонних лиц на рабочее место; за нарушение требований несёт дисциплинарную, материальную, административную и (в тяжёлых случаях) уголовную ответственность."}, {"t": "Охрана труда", "q": "Порядок допуска в котельную посторонних лиц в необходимых случаях", "a": "Посторонние лица допускаются в котельную только с разрешения начальника котельной (ответственного за исправное состояние и безопасную эксплуатацию) и в сопровождении оперативного персонала. Посетители обязаны соблюдать требования безопасности, носить каску и спецодежду; пребывание оформляется записью в журнале. В обходе оборудования посторонним лицам запрещается прикасаться к арматуре, задвижкам, вентилям и электропускателям."}, {"t": "Охрана труда", "q": "Какие места в котельной должны быть оборудованы аварийным освещением?", "a": "Фронт котлов и зона горелочных устройств; проходы между котлами и за ними; пульт управления и щит автоматики безопасности; насосная; дымососная; зона газового ввода и запорной арматуры; водоуказательные и измерительные приборы; помещения вспомогательного оборудования; пути эвакуации."}, {"t": "Охрана труда", "q": "Требования охраны труда во время работы", "a": "Соблюдение инструкций, использование СИЗ, контроль состояния оборудования, немедленное сообщение об опасностях, запрет на самовольные действия. Работник не должен приступать к работе при неисправностях, отсутствии СИЗ или без наряда-допуска на опасные работы."}, {"t": "Охрана труда", "q": "Ответственность за нарушение правил охраны труда", "a": "Дисциплинарная, материальная, административная, уголовная — в зависимости от тяжести последствий и характера нарушения. Ответственность несут как работники, так и должностные лица, допустившие нарушения. Основанием служат акты расследования, протоколы проверок, материалы комиссий."}, {"t": "Первая помощь", "q": "Признаки жизни и признаки смерти у пострадавшего", "a": "Признаки жизни: наличие пульса (на сонной, бедренной или лучевой артерии), самостоятельное дыхание (по движению грудной клетки), реакция зрачков на свет (сужение при освещении), роговичный рефлекс (моргание при лёгком прикосновении к ресницам). Признаки смерти: при подозрении на смерть сначала исключают клиническую (нет дыхания, сердцебиения, реакции зрачков). При подтверждении биологической смерти появляются: помутнение и высыхание роговицы, симптом «кошачий глаз» (при сдавлении глаза зрачок деформируется вертикально), похолодание тела, трупные пятна, трупное окоченение (через 2–4 часа)."}, {"t": "Первая помощь", "q": "Искусственная вентиляция лёгких (ИВЛ)", "a": "Цель — обеспечить поступление кислорода. Сначала обеспечивают проходимость дыхательных путей (запрокинуть голову, приподнять подбородок, очистить ротовую полость). Затем проводят вдувания: методом «рот в рот» (зажать нос, плотно обхватить губы пострадавшего) или «рот в нос» (закрыть рот, вдувать в нос). Эффективность контролируют по подъёму грудной клетки. Для гигиены можно использовать салфетку или специальную маску."}, {"t": "Первая помощь", "q": "Наружный массаж сердца. Признаки восстановления циркуляции крови", "a": "Проводят при отсутствии пульса. Спасатель помещает сложенные ладони на нижнюю половину грудины, надавливает ритмично (глубина 4–5 см, частота 100–120 в минуту), используя массу тела. После каждых 30 надавливаний — 2 вдоха ИВЛ (соотношение 30:2). Признаки восстановления: появление пульса на сонной артерии в такт нажатиям, сужение зрачков и появление реакции на свет, уменьшение цианоза кожи и слизистых, восстановление самостоятельного дыхания."}, {"t": "Первая помощь", "q": "Виды кровотечений. Первая помощь при кровотечении", "a": "Виды: артериальное (алая пульсирующая струя), венозное (тёмная ровная струя), капиллярное (медленное, по типу просачивания). Первая помощь: временная остановка (давящая повязка, жгут при артериальном), возвышенное положение конечности, холод к ране. При венозном — давящая повязка. При артериальном — жгут выше раны (записать время наложения)."}, {"t": "Первая помощь", "q": "Правила наложения жгута", "a": "Накладывают только при артериальном кровотечении. Выше раны, на одежду или подкладку. Затягивать до остановки кровотечения. Обязательно зафиксировать время наложения. Максимальное время: летом — 1 час, зимой — 30 минут. Через указанное время жгут ослабляют на 10 минут, затем накладывают снова."}, {"t": "Первая помощь", "q": "Первая помощь при переломах", "a": "Обеспечить неподвижность (иммобилизацию) повреждённой конечности с помощью шин (стандартных или импровизированных). Фиксировать минимум два сустава (выше и ниже перелома). При открытом переломе — сначала остановить кровотечение, наложить стерильную повязку. Не пытаться вправлять отломки кости."}, {"t": "Первая помощь", "q": "Первая помощь при вывихах, ушибах и растяжении связок", "a": "Вывих: иммобилизация, холод, обезболивание. Не вправлять самостоятельно! Ушиб: холод, покой, давящая повязка при необходимости. Растяжение: фиксация эластичным бинтом, холод, возвышенное положение конечности."}, {"t": "Первая помощь", "q": "Первая помощь при поражении электрическим током", "a": "Сначала освободить от действия тока (отключить источник, оттянуть за сухую одежду, использовать изолирующий предмет), затем оценить состояние. При отсутствии сознания, дыхания, пульса — приступить к СЛР. При ожогах — наложить стерильную повязку. Обеспечить покой, вызвать скорую помощь."}, {"t": "Первая помощь", "q": "Способы освобождения пострадавшего от действия электрического тока", "a": "Отключить источник (рубильник, выключатель). Если невозможно — оттянуть пострадавшего за сухую одежду, использовать изолирующий предмет (деревянная палка, резина). Не касаться открытых участков тела пострадавшего и металлических предметов. Использовать сухие перчатки или ткань."}, {"t": "Первая помощь", "q": "Виды ожогов. Первая помощь при ожогах", "a": "По глубине: I (покраснение), II (пузыри), III (некроз), IV (обугливание). Первая помощь: устранить источник, охладить (при I–II — прохладной водой 10–15 минут), наложить чистую сухую повязку. Не вскрывать пузыри, не наносить мази или масла. При обширных или глубоких ожогах — срочно вызвать скорую."}, {"t": "Первая помощь", "q": "Первая помощь при отравлении угарным газом", "a": "Вынести пострадавшего на свежий воздух. Обеспечить покой, расстегнуть стесняющую одежду. При отсутствии дыхания — ИВЛ, при отсутствии пульса — СЛР. Вызвать скорую помощь. При лёгкой степени — согревание, тёплое питьё."}, {"t": "Первая помощь", "q": "Правила вызова скорой медицинской помощи", "a": "Сообщить: адрес, количество пострадавших, их пол и возраст, характер повреждений и состояние, что уже сделано. Отвечать на уточняющие вопросы диспетчера. Не класть трубку первым — диспетчер сам завершит разговор."}, {"t": "Первая помощь", "q": "Понятие первой помощи. Основные принципы", "a": "Первая помощь — комплекс срочных простейших мероприятий для спасения жизни и здоровья до прибытия медиков. Принципы: безопасность спасателя и пострадавшего, оценка ситуации, приоритет (сначала угроза жизни — остановка кровотечения, СЛР), последовательность действий, минимизация дополнительных травм, вызов специалистов."}, {"t": "Первая помощь", "q": "Доврачебная помощь при попадании инородного тела в глаз", "a": "Не тереть глаз! Попробовать промыть чистой водой или физиологическим раствором. Если инородное тело не удаляется — не пытаться извлечь его самостоятельно (можно повредить роговицу). Обратиться к врачу."}, {"t": "Первая помощь", "q": "Сердечно-лёгочная реанимация (СЛР). Способы проведения", "a": "Проводят при отсутствии сознания, дыхания и пульса. Алгоритм: 30 надавливаний на грудную клетку (глубина 4–5 см, частота 100–120 в минуту) → 2 вдоха ИВЛ. Продолжать до появления признаков жизни или прибытия медиков. При наличии автоматического наружного дефибриллятора (АНД) — использовать его по инструкции."}, {"t": "Стропальщик", "q": "Обязанности стропальщика перед началом работы", "a": "1) получить задание от лица, ответственного за безопасное производство работ; 2) ознакомиться (под роспись) с проектом производства работ, технологическими картами или нарядом-допуском (в т.ч. при работах вблизи ЛЭП); 3) проверить исправность грузозахватных приспособлений: наличие клейм/бирок с номером, датой испытания и грузоподъёмностью; 4) проверить маркировку и исправность тары (назначение, номер, собственная и предельная масса); 5) подобрать приспособления, соответствующие массе и характеру груза; 6) привести в порядок спецодежду: застегнуть манжеты, убрать свисающие концы, надеть головной убор, проверить обувь на отсутствие скользкой подошвы."}, {"t": "Стропальщик", "q": "Обязанности при обвязке и зацепке грузов", "a": "1) работать строго по утверждённым схемам строповки, технологическим картам или проекту; 2) проверить массу груза по маркировке или списку; если массу определить нельзя — сообщить ответственному лицу; 3) накладывать канаты и цепи на основной массив груза без узлов, перекруток и петель; 4) под острые рёбра подкладывать защитные подкладки; 5) обеспечить устойчивость груза и исключить падение его частей; 6) длинномерные грузы строповать не менее чем в двух местах; 7) грузы с петлями, рымами, цапфами зацеплять за все предусмотренные элементы; 8) неиспользованные концы многоветвевого стропа надёжно закрепить. Запрещено: строповать груз с неизвестной массой, использовать повреждённые или немаркированные приспособления, применять способы, не предусмотренные схемами, поправлять стропы ударами инструментов, работать с приставными лестницами."}, {"t": "Стропальщик", "q": "Обязанности при опускании груза", "a": "1) убедиться, что место установки подготовлено: есть прочные подкладки, поверхность устойчива, нет риска опрокидывания или смещения; 2) дать команду на опускание только после проверки зоны установки; 3) контролировать положение груза до полной установки; 4) снимать стропы только после того, как груз надёжно установлен и при необходимости закреплён."}, {"t": "Стропальщик", "q": "Правила строповки грузов", "a": "1) строповать строго по утверждённым схемам; 2) выбирать приспособления по массе и форме груза; 3) равномерно распределять нагрузку, избегать перекосов; 4) использовать подкладки под острые рёбра; 5) для длинномерных грузов — минимум две точки строповки; 6) зацеплять за все предусмотренные монтажные элементы (петли, рымы, цапфы)."}, {"t": "Стропальщик", "q": "Функции стропальщика и сигнальщика", "a": "Стропальщик: непосредственно выполняет обвязку, зацепку, контроль груза, подаёт сигналы крановщику, следит за безопасностью в зоне работ. Сигнальщик: назначается при отсутствии прямой видимости между стропальщиком и крановщиком; передаёт команды крановщику. Один аттестованный работник может совмещать обе функции, если видимость прямая."}, {"t": "Стропальщик", "q": "Конструктивные особенности грузозахватных приспособлений", "a": "Стропы: гибкие элементы (канатные, цепные, текстильные) для обхвата груза. Траверсы: жёсткие конструкции (балки, рамы) для равномерного распределения нагрузки, применяются для длинномерных и крупногабаритных грузов. Захваты: специализированные устройства под конкретные типы грузов (рулоны, ёмкости и т.п.). Проушины, рымы, цапфы: элементы на самом грузе, предназначенные для зацепки."}, {"t": "Стропальщик", "q": "Выбор грузозахватного приспособления в зависимости от массы груза", "a": "Грузоподъёмность приспособления должна быть не ниже массы поднимаемого груза. Выбор делают с учётом схемы строповки, угла наклона ветвей стропа, характера груза и условий работы. Нельзя использовать приспособление, чья грузоподъёмность ниже массы груза."}, {"t": "Стропальщик", "q": "Знаковая сигнализация при работе на ГПМ", "a": "«Вира» (подъём): прерывистое движение рукой вверх на уровне пояса, ладонь вверх. «Майна» (опускание): прерывистое движение рукой вниз перед грудью, ладонь вниз. «Стоп»: резкое движение рукой вправо и влево на уровне пояса, ладонь вниз. «Осторожно»: кисти рук обращены ладонями друг к другу на небольшом расстоянии, руки подняты вверх (подаётся перед незначительным перемещением). При плохой видимости используют флажки, фонари; при отсутствии прямой видимости или на больших расстояниях — радиосвязь."}, {"t": "Стропальщик", "q": "Нормы выбраковки стальных канатов", "a": "Канат бракуют при: обрывах проволок сверх допустимой нормы; уменьшении диаметра из-за износа или коррозии; деформациях: выпучивание прядей, расслоение, корзинообразная деформация; следах перегрева или сильного изгиба; износе наружных проволок выше допустимых значений (нормы зависят от типа каната и регламентируются нормативами)."}, {"t": "Стропальщик", "q": "Работа вблизи ЛЭП", "a": "Работы вблизи линий электропередачи проводятся: только по наряду-допуску с прописанными мерами безопасности; с соблюдением безопасного расстояния до проводов под напряжением; под контролем ответственного за безопасное производство работ."}, {"t": "Стропальщик", "q": "Меры безопасности при строповке (отцепке) грузов в стеснённых условиях", "a": "Оценить зону работ: исключить риск защемления стропов или груза между стенами, колоннами, станками. Использовать оттяжки для контроля положения груза. Не допускать нахождения людей в зоне возможного защемления или падения груза. Проверять, что груз не защемлён, не завален, не примёрз."}, {"t": "Стропальщик", "q": "Действия стропальщика при аварийных ситуациях", "a": "1) немедленно подать сигнал «Стоп» и остановить операцию; 2) сообщить ответственному лицу о происшествии; 3) при необходимости оказать первую помощь пострадавшим; 4) сохранить обстановку для расследования (если это не угрожает жизни и здоровью людей)."}, {"t": "Стропальщик", "q": "Меры безопасности при строповке груза", "a": "Использовать только исправные и маркированные приспособления. Строповать по утверждённым схемам. Не применять не предусмотренные приспособления (проволоку, ломы и т.п.). Не поправлять стропы на весу ударами инструментов. Не использовать приставные лестницы: для высоких грузов применять переносные площадки. Убедиться, что груз не защемлён и не примерз."}, {"t": "Стропальщик", "q": "Назначение маркировки съёмных грузозахватных приспособлений и тары", "a": "На приспособлениях (стропы, траверсы): номер, дата испытания, грузоподъёмность — для контроля пригодности и сроков испытаний. На таре: назначение, номер, собственная масса и предельная масса груза — для правильного применения и исключения перегруза."}, {"t": "Стропальщик", "q": "Когда должен присутствовать ответственный за безопасное производство работ", "a": "При строповке грузов без утверждённых схем; при подъёме груза несколькими кранами; при работе вблизи ЛЭП; при перемещении груза над перекрытиями помещений, где могут находиться люди; в особо сложных или нестандартных условиях."}, {"t": "Пожарная безопасность", "q": "Причины возникновения пожара в котельной", "a": "Утечки топлива (газа, жидкого) из трубопроводов, арматуры, горелок (коррозия, вибрация, некачественный монтаж); перегрев оборудования при нарушении режимов работы котлов; нарушения в электрических системах: короткие замыкания, искрение, неисправная проводка; накопление пыли и грязи (особенно опасна угольная пыль); неисправности вентиляционных систем, из-за чего накапливаются взрывоопасные газы и пары; сбои автоматики (неправильный сигнал, незакрывшийся клапан); человеческий фактор: халатность, пренебрежение инструкциями, курение в неположенных местах; форс-мажор: стихийные бедствия, скачки напряжения."}, {"t": "Пожарная безопасность", "q": "Ликвидация возгорания в газовой котельной", "a": "1) немедленно прекратить подачу газа к котлам (перекрыть газовые задвижки); 2) сообщить о возгорании руководству и вызвать пожарную охрану, если не удаётся быстро локализовать очаг; 3) обесточить электрооборудование в зоне возгорания; 4) приступить к тушению первичными средствами (огнетушители, песок, кошма), задействовать стационарные системы пожаротушения; 5) интенсивно вентилировать помещение для снижения концентрации газа; 6) если возгорание не удаётся локализовать — вызвать пожарную охрану; 7) организовать эвакуацию персонала из опасной зоны."}, {"t": "Пожарная безопасность", "q": "Мероприятия противопожарной безопасности газовых котельных", "a": "Регулярное техническое обслуживание и чистка оборудования; установка систем контроля загазованности; обеспечение достаточной вентиляции; использование негорючих материалов; соблюдение правил хранения топлива; проведение противопожарных инструктажей для персонала; наличие и исправность первичных средств пожаротушения; соблюдение правил эксплуатации газового и электрооборудования."}, {"t": "Пожарная безопасность", "q": "Первичные средства пожаротушения", "a": "Огнетушители (ОП, ОУ), пожарный кран, песок, кошма (противопожарное полотно), лопата для песка."}, {"t": "Пожарная безопасность", "q": "Действия слесаря-ремонтника при возгорании электродвигателя", "a": "1) немедленно отключить электродвигатель от электросети; 2) сообщить о возгорании руководству и вызвать пожарную охрану, если не удаётся быстро локализовать очаг; 3) приступить к тушению с помощью подходящих средств (для электрооборудования под напряжением — только углекислотный огнетушитель ОУ или порошковый ОП; воду применять нельзя); 4) эвакуировать персонал из опасной зоны."}, {"t": "Пожарная безопасность", "q": "Категории взрывопожарной и пожарной опасности", "a": "Для газовых котельных характерны категории А (повышенная взрывопожароопасность) или Б (взрывопожароопасность) в зависимости от объёма газа, давления, условий вентиляции."}, {"t": "Пожарная безопасность", "q": "Ответственность за соблюдение противопожарного режима", "a": "Ответственность несут: руководитель организации, лицо, назначенное ответственным за пожарную безопасность, а также каждый работник в пределах своих должностных обязанностей."}, {"t": "Пожарная безопасность", "q": "Техника безопасности при выполнении пожароопасных работ", "a": "Использовать инструменты, не дающие искр (из цветного металла), либо смазывать инструменты из чёрного металла. Запрещено применять электрические инструменты, дающие искрение, в загазованной среде. Обеспечить наличие первичных средств пожаротушения на месте работ. Контролировать загазованность. Оформлять наряд-допуск на пожароопасные работы."}, {"t": "Пожарная безопасность", "q": "Требования к путям эвакуации на котельной", "a": "Пути должны быть свободными, обозначены знаками эвакуации, иметь достаточную ширину. Необходимо обеспечить быстрый и безопасный выход персонала из здания в случае пожара."}, {"t": "Пожарная безопасность", "q": "Порядок действий слесаря-ремонтника при пожаре", "a": "1) немедленно сообщить о пожаре руководству и вызвать пожарную охрану; 2) принять меры по эвакуации персонала из опасной зоны; 3) при возможности — локализовать очаг возгорания первичными средствами; 4) оказать первую помощь пострадавшим; 5) сохранить обстановку на месте пожара (если это не угрожает жизни и здоровью людей) для последующего расследования."}, {"t": "Пожарная безопасность", "q": "Применение огнетушителя ОП (порошкового)", "a": "Область применения: пожары классов A (твёрдые горючие вещества), B (жидкие горючие жидкости), C (газообразные вещества), электроустановки под напряжением до 1000 В. Порядок: сорвать пломбу, выдернуть чеку, направить ствол-насадку на очаг, нажать на ручку запуска. Тактика: подавать порошок в основание очага, покрывая поверхность горящего вещества. Меры безопасности: не использовать в замкнутых помещениях без СИЗОД (порошок снижает видимость и может раздражать дыхательные пути); избегать попадания на кожу."}, {"t": "Пожарная безопасность", "q": "Применение огнетушителя ОУ (углекислотного)", "a": "Область применения: электроустановки под напряжением, ценные объекты (музеи, серверные), где важно не повредить оборудование. Порядок: сорвать пломбу, выдернуть чеку, направить раструб на очаг, нажать на рычаг. Тактика: подавать углекислоту в основание очага, обеспечивая вытеснение кислорода. Меры безопасности: не касаться раструба голыми руками (он сильно охлаждается); не использовать в замкнутых помещениях без вентиляции (углекислый газ вытесняет кислород)."}, {"t": "Пожарная безопасность", "q": "Применение пожарного крана", "a": "Область применения: тушение возгораний твёрдых горючих материалов (класс A), кроме электроустановок под напряжением. Порядок: открыть шкаф, развернуть рукав, открыть вентиль, направить струю воды в зону возгорания. Тактика: подавать струю воды в основание очага, постепенно покрывая всю горящую поверхность. Меры безопасности: действовать вдвоём (один открывает вентиль, второй направляет ствол); не использовать для тушения электрооборудования под напряжением."}, {"t": "Пожарная безопасность", "q": "Применение песка при тушении пожара", "a": "Область применения: небольшие очаги, особенно жидкостей (масло, бензин), а также оборудование, которое нельзя тушить водой. Тактика: насыпать песок вокруг очага, чтобы ограничить распространение горящей жидкости, затем засыпать сам очаг."}, {"t": "Пожарная безопасность", "q": "Применение воды при тушении пожара", "a": "Область применения: твёрдые горючие материалы (дерево, бумага, текстиль). Тактика: подавать воду в основание очага, охлаждая горящие поверхности. Меры безопасности: категорически нельзя применять воду для тушения электроустановок под напряжением и горючих жидкостей (вода тяжелее многих жидкостей, растекается, распространяя огонь)."}, {"t": "Пожарная безопасность", "q": "Применение кошмы (противопожарного полотна)", "a": "Область применения: небольшие очаги, в том числе одежда на человеке, возгорания на кухне (сковорода с маслом). Тактика: накрыть очаг полотном, прижимая края, чтобы перекрыть доступ кислорода. Меры безопасности: не использовать для крупных или сложных очагов; не прикасаться к полотну сразу после тушения (оно может быть горячим)."}];

const COLORS = {
  "Эксплуатация": "#4a7dff",
  "Охрана труда": "#e8792f",
  "Первая помощь": "#d6455f",
  "Стропальщик": "#1e9e5a",
  "Пожарная безопасность": "#b0352a"
};
const N_FIELDS = 7;
let fields = new Array(N_FIELDS).fill("");

function initFields(){
  const box = document.getElementById('fields');
  box.innerHTML = '';
  for (let i = 0; i < N_FIELDS; i++){
    const row = document.createElement('div');
    row.className = 'qrow';
    row.innerHTML = '<div class="qnum">' + (i+1) + '</div>';
    const inp = document.createElement('input');
    inp.id = 'q'+i; inp.placeholder = 'Вопрос ' + (i+1);
    inp.oninput = () => fields[i] = inp.value;
    row.appendChild(inp);
    box.appendChild(row);
  }
}

function norm(s){
  return (s||"").toLowerCase().replace(/ё/g,'е').replace(/[^\wа-я\s]/gi,' ').replace(/\s+/g,' ').trim();
}
const STOP = new Set(["какие","какой","при","для","и","в","на","с","по","их","его","что","чем","как","при","когда","перед","после","если","это","должны","нужен"]);
function tokens(s){
  return norm(s).split(' ').filter(w => w.length >= 4 && !STOP.has(w));
}
function scoreQuestion(query, item){
  const a = new Set(tokens(query)), b = new Set(tokens(item.q));
  if (!a.size) return 0;
  let hit = 0;
  a.forEach(w => { if (b.has(w)) hit++; });
  return hit / a.size;
}
function findBest(q){
  let best = {s:-1, idx:-1};
  DATA.forEach((d,i) => { const s = scoreQuestion(q, d); if (s > best.s) best = {s, idx:i}; });
  return best;
}

function renderAnswers(list){
  // list: [{q, a, t, exact, sugg}]
  const out = document.getElementById('results');
  out.innerHTML = '';
  list.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'ans';
    let html = '<span class="num">' + (i+1) + '.</span><span class="q">' + esc(r.q) + '<span class="tag" style="background:' + (COLORS[r.t]||"#666") + '">' + esc(r.t) + '</span></span>';
    if (r.a){
      html += '<div class="a">' + esc(r.a) + '<a href="../exploitation/28.html">доп</a>'+'</div>';
    } else {
      html += '<div class="warn">⚠️ Точного совпадения нет (' + Math.round(r.score*100) + '%). Ближайшие вопросы из базы — кликните, чтобы подставить:</div>';
      html += '<div class="suggest">';
      (r.sugg||[]).forEach(s => {
        html += '<button onclick="pickSuggestion(' + i + ',' + s.idx + ')">' + esc(DATA[s.idx].q.slice(0,72)) + '</button>';
      });
      html += '</div>';
    }
    div.innerHTML = html;
    out.appendChild(div);
  });
}

function pickSuggestion(i, idx){
  const inp = document.getElementById('q'+i);
  inp.value = DATA[idx].q;
  fields[i] = DATA[idx].q;
  collect();
}

function collect(){
  const res = fields.map((q, i) => {
    if (!q || !q.trim()) return {q: q||'(пусто)', t:'', a:null, score:0, sugg:[]};
    const best = findBest(q);
    if (best.s >= 0.5){
      const d = DATA[best.idx];
      return {q: d.q, a: d.a, t: d.t, exact:true, score:best.s};
    }
    const ranked = DATA.map((d,idx) => ({idx, s: scoreQuestion(q, d)})).sort((x,y)=>y.s-x.s).slice(0,3);
    return {q: q, a:null, t:'', score:best.s, sugg:ranked};
  });
  document.getElementById('resultsCard').style.display = 'block';
  renderAnswers(res);
  document.getElementById('resultsCard').scrollIntoView({behavior:'smooth'});
}

function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function randomTicket(){
  const byTopic = {};
  DATA.forEach((d, idx) => { (byTopic[d.t] = byTopic[d.t] || []).push(idx); });
  const picked = [];
  // по одному случайному из каждой темы
  Object.keys(byTopic).forEach(t => {
    const arr = byTopic[t];
    picked.push(arr[Math.floor(Math.random()*arr.length)]);
  });
  // ещё 2 случайных из оставшихся
  const rest = DATA.map((_, i) => i).filter(i => !picked.includes(i));
  for (let k = 0; k < 2 && rest.length; k++){
    const r = Math.floor(Math.random()*rest.length);
    picked.push(rest.splice(r,1)[0]);
  }
  // перемешать порядок
  picked.sort(() => Math.random() - 0.5);
  picked.slice(0, N_FIELDS).forEach((idx, i) => {
    fields[i] = DATA[idx].q;
    document.getElementById('q'+i).value = DATA[idx].q;
  });
  collect();
}

function clearAll(){
  fields = new Array(N_FIELDS).fill("");
  for (let i = 0; i < N_FIELDS; i++) document.getElementById('q'+i).value = '';
  document.getElementById('resultsCard').style.display = 'none';
}

function renderBank(){
  const filter = document.getElementById('search').value.trim().toLowerCase().replace(/ё/g,'е');
  const bank = document.getElementById('bank');
  bank.innerHTML = '';
  let shown = 0;
  const topics = [...new Set(DATA.map(d => d.t))];
  topics.forEach(t => {
    const items = DATA.map((d,i) => ({d, i})).filter(x => x.d.t === t && (!filter || x.d.q.toLowerCase().replace(/ё/g,'е').includes(filter)));
    if (!items.length) return;
    shown += items.length;
    const det = document.createElement('details');
    det.className = 'tgroup';
    det.innerHTML = '<summary>' + esc(t) + ' <span class="count">(' + items.length + ')</span></summary>';
    const ul = document.createElement('ul');
    items.forEach(x => {
      const li = document.createElement('li');
      li.textContent = x.d.q;
      li.onclick = () => {
        for (let k = 0; k < N_FIELDS; k++){
          if (!fields[k]){
            fields[k] = x.d.q;
            document.getElementById('q'+k).value = x.d.q;
            break;
          }
        }
      };
      ul.appendChild(li);
    });
    det.appendChild(ul);
    bank.appendChild(det);
  });
  document.getElementById('bankCount').textContent = 'Найдено: ' + shown;
}

function buildAnswersDoc(){
  let rows = '';
  const res = fields.map(q => {
    if (!q || !q.trim()) return null;
    const best = findBest(q);
    return {q, best};
  }).filter(Boolean);
  res.forEach((r, i) => {
    const d = r.best.s >= 0.5 ? DATA[r.best.idx] : null;
    const theme = d ? d.t : 'не найдено';
    const ans = d ? esc(d.a) : '<i>Точного совпадения нет в базе. Ближайший вопрос: ' + esc(DATA[r.best.idx].q) + '</i>';
    rows += '<tr><td>' + (i+1) + '</td><td>' + esc(r.q) + '</td><td>' + esc(theme) + '</td><td>' + ans + '</td></tr>';
  });
  return '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Билет с ответами</title>' +
    '<style>body{font-family:Georgia,serif;margin:28px;color:#111}h1{font-size:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:8px;vertical-align:top;font-size:13px;text-align:left}th{background:#eee}.meta{color:#555;font-size:12px;margin-top:18px}</style>' +
    '</head><body><h1>Экзаменационный билет</h1><table><tr><th>№</th><th>Вопрос</th><th>Тема</th><th>Ответ</th></tr>' + rows + '</table>' +
    '<p class="meta">Собрано: ' + new Date().toLocaleString('ru-RU') + '</p></body></html>';
}

function downloadAnswers(){
  const blob = new Blob([buildAnswersDoc()], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'билет_с_ответами.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function printAnswers(){
  const w = window.open('', '_blank');
  w.document.write(buildAnswersDoc());
  w.document.close();
  w.focus();
  w.print();
}

initFields();
renderBank();
</script>
</body>
</html>
